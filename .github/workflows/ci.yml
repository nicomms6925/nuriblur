name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    env:
      # 러너 콘솔 기본 인코딩(cp1252)은 한글 출력에서 실패한다
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: install (uv.lock 그대로)
        run: uv sync --locked
      - name: proto
        run: uv run python scripts/gen_proto.py
      - name: lint
        run: uv run ruff check worker app scripts tests
      - name: license
        run: uv run python scripts/ci/check_license.py
      - name: tests (fast)
        run: uv run pytest -q -m "not slow and not ui"
      - name: tests (exposure gate · formats · server)
        run: uv run pytest -q -m "slow and not ui"
      - name: tests (ui)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q -m "ui"
