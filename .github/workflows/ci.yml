name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    env:
      # 러너 콘솔 기본 인코딩(cp1252)은 한글 출력에서 실패한다
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: proto
        run: python scripts/gen_proto.py
      - name: lint
        run: python -m ruff check worker app scripts tests
      - name: license
        run: python scripts/ci/check_license.py
      - name: tests (fast)
        run: python -m pytest -q -m "not slow and not ui"
      - name: tests (exposure gate · formats · server)
        run: python -m pytest -q -m "slow"
      - name: tests (ui)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "ui"
