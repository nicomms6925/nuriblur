repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
        exclude: ^(worker|app)/pb/
      - id: license
        name: license (manifest·import 검사)
        entry: python scripts/ci/check_license.py
        language: system
        pass_filenames: false
        files: ^(models/manifest\.json|.*\.py)$
